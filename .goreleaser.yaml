# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: snapordie

before:
  hooks:
    - go mod verify
    - go vet ./...

builds:
  - id: snapordie
    main: .
    binary: snapordie
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/sago/snapordie/cmd.Version={{ .Version }}
      - -X github.com/sago/snapordie/cmd.Commit={{ .Commit }}
      - -X github.com/sago/snapordie/cmd.Date={{ .Date }}

archives:
  - id: snapordie
    builds:
      - snapordie
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
